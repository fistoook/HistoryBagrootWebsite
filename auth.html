<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>התחברות - מסע דרך ההיסטוריה</title>
    <link rel="stylesheet" href="styles/style.css">
    <style>
        .auth-container {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: var(--font-family);
        }

        .auth-wrapper {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 420px;
            width: 100%;
            overflow: hidden;
        }

        .auth-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        .auth-header h1 {
            margin: 0 0 10px;
            font-size: 28px;
        }

        .auth-header p {
            margin: 0;
            opacity: 0.9;
            font-size: 14px;
        }

        .auth-content {
            padding: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group input.error {
            border-color: #e74c3c;
        }

        .error-message {
            color: #e74c3c;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .btn-auth {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 10px;
        }

        .btn-auth:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-auth:active {
            transform: translateY(0);
        }

        .auth-toggle {
            text-align: center;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
        }

        .auth-toggle p {
            color: #666;
            font-size: 14px;
            margin: 0;
        }

        .auth-toggle a {
            color: #667eea;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
        }

        .auth-toggle a:hover {
            text-decoration: underline;
        }

        .form-section {
            display: none;
        }

        .form-section.active {
            display: block;
        }

        .avatar-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
            max-height: 300px;
            overflow-y: auto;
            padding: 10px;
        }

        .avatar-option {
            border: 3px solid #e0e0e0;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f9f9f9;
        }

        .avatar-option:hover {
            border-color: #667eea;
            background: #f0f4ff;
            transform: translateY(-5px);
        }

        .avatar-option.selected {
            border-color: #667eea;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1), rgba(118, 75, 162, 0.1));
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
        }

        .avatar-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .avatar-name {
            font-weight: 600;
            font-size: 12px;
            color: #333;
            margin-bottom: 5px;
        }

        .avatar-title {
            font-size: 11px;
            color: #999;
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .auth-wrapper {
                max-width: 100%;
            }

            .auth-header {
                padding: 25px 15px;
            }

            .auth-header h1 {
                font-size: 24px;
            }

            .auth-content {
                padding: 20px;
            }

            .avatar-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-wrapper">
            <div class="auth-header">
                <h1>🏛️ מסע היסטורי</h1>
                <p>הצטרפו למסע מוקד דרך ההיסטוריה</p>
            </div>

            <div class="auth-content">
                <!-- Login Form -->
                <div id="loginForm" class="form-section active">
                    <form onsubmit="handleLogin(event)">
                        <div class="form-group">
                            <label>שם משתמש או דוא"ל</label>
                            <input type="text" id="loginUsername" placeholder="הכנס את שם המשתמש שלך" required>
                            <div class="error-message" id="loginUsernameError"></div>
                        </div>

                        <div class="form-group">
                            <label>סיסמה</label>
                            <input type="password" id="loginPassword" placeholder="הכנס את הסיסמה שלך" required>
                            <div class="error-message" id="loginPasswordError"></div>
                        </div>

                        <button type="submit" class="btn-auth">התחבר</button>
                    </form>

                    <div class="auth-toggle">
                        <p>עדיין לא חברים? <a onclick="toggleForm()">יצור חשבון חדש</a></p>
                    </div>
                </div>

                <!-- Register Form -->
                <div id="registerForm" class="form-section">
                    <form onsubmit="handleRegister(event)">
                        <div class="form-group">
                            <label>שם משתמש</label>
                            <input type="text" id="registerUsername" placeholder="בחר שם משתמש" required>
                            <div class="error-message" id="registerUsernameError"></div>
                        </div>

                        <div class="form-group">
                            <label>דוא"ל</label>
                            <input type="email" id="registerEmail" placeholder="הכנס את דוא"לך" required>
                            <div class="error-message" id="registerEmailError"></div>
                        </div>

                        <div class="form-group">
                            <label>סיסמה</label>
                            <input type="password" id="registerPassword" placeholder="לפחות 8 תווים" required minlength="8">
                            <div class="error-message" id="registerPasswordError"></div>
                        </div>

                        <div class="form-group">
                            <label>אימות סיסמה</label>
                            <input type="password" id="registerConfirmPassword" placeholder="חזור על הסיסמה" required>
                            <div class="error-message" id="registerConfirmError"></div>
                        </div>

                        <div class="form-group">
                            <label>בחר את הדמות ההיסטורית שלך 🎭</label>
                            <div class="avatar-grid" id="avatarGrid"></div>
                            <div class="error-message" id="avatarError"></div>
                        </div>

                        <button type="submit" class="btn-auth">יצור חשבון</button>
                    </form>

                    <div class="auth-toggle">
                        <p>כבר יש לך חשבון? <a onclick="toggleForm()">התחבר כאן</a></p>
                    </div>
                </div>

                <!-- Demo Mode -->
                <div style="text-align: center; margin-top: 15px; padding-top: 15px; border-top: 1px solid #e0e0e0;">
                    <p style="color: #999; font-size: 12px; margin: 0 0 8px;">או נסה את ההדגמה</p>
                    <button onclick="tryDemo()" style="background: #f0f0f0; color: #333; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; width: 100%; font-weight: 600;">נסה את המפה</button>
                </div>
            </div>
        </div>
    </div>

    <script src="scripts/user-system.js"></script>
    <script>
        let selectedAvatar = null;

        // Initialize avatar grid
        function initAvatarGrid() {
            const grid = document.getElementById('avatarGrid');
            grid.innerHTML = '';

            HISTORICAL_FIGURES.forEach(figure => {
                const option = document.createElement('div');
                option.className = 'avatar-option';
                option.onclick = () => selectAvatar(figure.id, option);
                option.innerHTML = `
                    <div class="avatar-icon" style="font-size: 50px; background: ${figure.color}; width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; border-radius: 50%; margin: 0 auto 8px;">${figure.icon}</div>
                    <div class="avatar-name">${figure.name}</div>
                    <div class="avatar-title">${figure.title}</div>
                `;
                grid.appendChild(option);
            });
        }

        function selectAvatar(avatarId, element) {
            selectedAvatar = avatarId;
            document.querySelectorAll('.avatar-option').forEach(el => el.classList.remove('selected'));
            element.classList.add('selected');
        }

        function toggleForm() {
            document.getElementById('loginForm').classList.toggle('active');
            document.getElementById('registerForm').classList.toggle('active');
            selectedAvatar = null;

            if (document.getElementById('registerForm').classList.contains('active')) {
                initAvatarGrid();
            }
        }

        function clearErrors() {
            document.querySelectorAll('.error-message').forEach(el => el.classList.remove('show'));
            document.querySelectorAll('input').forEach(el => el.classList.remove('error'));
        }

        function showError(elementId, message) {
            const errorEl = document.getElementById(elementId);
            if (errorEl) {
                errorEl.textContent = message;
                errorEl.classList.add('show');
                errorEl.parentElement.querySelector('input')?.classList.add('error');
            }
        }

        async function handleLogin(event) {
            event.preventDefault();
            clearErrors();

            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;

            if (!username) {
                showError('loginUsernameError', 'הכנס שם משתמש או דוא"ל');
                return;
            }

            if (!password) {
                showError('loginPasswordError', 'הכנס סיסמה');
                return;
            }

            // Simple demo login - in production, verify against backend
            const users = userSystem.getAllUsers();
            let user = Object.values(users).find(u => 
                u.username.toLowerCase() === username.toLowerCase() || 
                u.email.toLowerCase() === username.toLowerCase()
            );

            if (user) {
                userSystem.loadUser(user.id, password);
                window.location.href = 'timeline-map.html';
            } else {
                showError('loginUsernameError', 'שם המשתמש או הסיסמה אינם נכונים');
            }
        }

        async function handleRegister(event) {
            event.preventDefault();
            clearErrors();

            const username = document.getElementById('registerUsername').value.trim();
            const email = document.getElementById('registerEmail').value.trim();
            const password = document.getElementById('registerPassword').value;
            const confirmPassword = document.getElementById('registerConfirmPassword').value;

            let hasError = false;

            if (!username || username.length < 3) {
                showError('registerUsernameError', 'שם המשתמש צריך להיות לפחות 3 תווים');
                hasError = true;
            }

            if (userSystem.usernameExists(username)) {
                showError('registerUsernameError', 'שם המשתמש כבר קיים');
                hasError = true;
            }

            if (!email || !email.includes('@')) {
                showError('registerEmailError', 'דוא"ל לא תקין');
                hasError = true;
            }

            if (password.length < 8) {
                showError('registerPasswordError', 'הסיסמה צריכה להיות לפחות 8 תווים');
                hasError = true;
            }

            if (password !== confirmPassword) {
                showError('registerConfirmError', 'הסיסמות אינן תואמות');
                hasError = true;
            }

            if (!selectedAvatar) {
                showError('avatarError', 'בחר דמות היסטורית');
                hasError = true;
            }

            if (hasError) return;

            // Create new user
            const newUser = userSystem.createUser(username, email, selectedAvatar);
            console.log('משתמש חדש נוצר:', newUser);
            window.location.href = 'timeline-map.html';
        }

        function tryDemo() {
            // Create demo user for testing
            const demoUser = userSystem.createUser(
                'דוגמה_' + Math.random().toString(36).substr(2, 5),
                'demo@example.com',
                'churchill'
            );
            window.location.href = 'timeline-map.html';
        }

        // Initialize on page load
        window.addEventListener('load', () => {
            // If user already logged in, redirect to map
            if (userSystem.getCurrentUser()) {
                window.location.href = 'timeline-map.html';
            }
        });
    </script>
</body>
</html>
