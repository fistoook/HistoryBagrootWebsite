<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=timeline-map.html">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>מעבר למפת התחנות...</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #e8f5ef 0%, #d4e8df 100%);
      margin: 0;
      direction: rtl;
      text-align: center;
    }
    .redirect-message {
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      max-width: 500px;
    }
    .redirect-message h1 {
      color: #2d7a5e;
      margin-bottom: 15px;
    }
    .redirect-message p {
      color: #666;
      line-height: 1.6;
      margin-bottom: 20px;
    }
    .spinner {
      display: inline-block;
      width: 40px;
      height: 40px;
      border: 4px solid #d0e8dc;
      border-top-color: #2d7a5e;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    a {
      color: #2d7a5e;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="redirect-message">
    <h1>🗺️ שדרגנו את חווית הלמידה!</h1>
    <p>ציר הזמן האינטראקטיבי הפך למפת תחנות אינטראקטיבית עם חידונים ואנימציות!</p>
    <div class="spinner"></div>
    <p style="margin-top: 20px;">מעבירים אותך למפת התחנות החדשה...</p>
    <p style="font-size: 0.9em;"><a href="timeline-map.html">לחצו כאן אם לא הועברתם אוטומטית</a></p>
  </div>
  <script>
    // Redirect after 2 seconds to allow users to read the message
    setTimeout(() => {
      window.location.href = 'timeline-map.html';
    }, 2000);
  </script>
</body>
</html>
